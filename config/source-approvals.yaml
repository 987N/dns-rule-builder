profile_change_policy:
  same-profile-valid-domain-add_remove: inherits reviewed source profile; retain provenance and publish per-source
    diff
  requires_new_review:
  - license or notice hash
  - selected source/key/file/include closure identity
  - format or adapter/capability change
  - shared-scope baseline change
  - new unsupported syntax or invalid-domain signature
  protected_scope:
  - Do not proxy auth0.com, stripe.com, or cloudfront.net suffixes.
  - A service-specific exact host on shared infrastructure requires official service evidence.
  - Do not infer routing from @cn/@ads/@telemetry attributes; only exact reviewed exclusions affect output.
  - The Google key is a Google Inc family list and recursively includes YouTube and Google DeepMind; it is not a
    foreign-domain aggregate.
