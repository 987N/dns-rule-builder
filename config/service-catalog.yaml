schema_version: 1
purpose: R1 source evidence plus R3 code-managed service review and build-gating catalog.
default_state: pending_review
default_enabled: false
selection_policy: 'One explicitly reviewed source is selected per service; configured selected_source
  controls the source. Candidate sources remain evidence only. Do not implicitly union same-service
  sources or prefer blackmatrix7 automatically.'
missing_semantics: missing=true means no selected buildable source exists; upstream_key_missing=true means the pinned upstreams have no independent key, even if a controlled local source is selected.
sources:
  blackmatrix7:
    repository: https://github.com/blackmatrix7/ios_rule_script
    revision: 83f37120c155f67c8eef43221dabe15cc3c95fec
    archive_sha256: e4249eb848059306541eea99ce5ecc1c0a988810afc716cb76db456159c6bf99
    source_path: rule/Surge/{category}/{category}.list
    commit_date_utc: '2026-10-09T22:09:47Z'
  v2fly:
    repository: https://github.com/v2fly/domain-list-community
    revision: c6adacf29cc4fb05e04651fcf03e00989ef9f797
    archive_sha256: d5a59ddc7b1577741ab910b1b5b0aa662f1456d41477bbfe056599f9e97f8ef0
    source_path: data/{key}
    commit_date_utc: '2026-10-09T10:11:47Z'
group_model:
  purpose_groups:
  - AI
  - Development
  - Social
  - Communication
  - Streaming
  - Music
  - Gaming
  - Media-Metadata
  - Cloud
  - Knowledge
  - Payments
  - Apple-Overseas
  - Adult
  - Foreign-General
  - Downloads
  service_group_rule: Purpose groups organize services; use distinct service policy
    groups for Google, YouTube, Gemini, Telegram and selected streaming services
    that require independent routing.
  node_selection: Node members and strategy-selector membership are intentionally
    unspecified pending user review.
  unmatched_domains: Remain Real-IP/direct unless separately reviewed and configured.
  apple_default: Common Apple services remain direct by default. AppleDev, AppleTV,
    and AppleTV+ are optional disabled Apple-Overseas candidates; account, hardware,
    media, and iCloud entries are reference-only direct.
  apple_overseas: Apple-Overseas is an optional overseas proxy selector; default disabled
    and requires user approval.
  communication_and_social: Separate messaging/communications from social-network
    purpose groups.
  service_groups:
  - Google
  - YouTube
  - Gemini
  - Telegram
  - Netflix
  - DisneyPlus
  - PrimeVideo
  - HBO
  - Hulu
  - Abema
  - Bahamut
  - Downloads
  - OpenSubtitles
  - ParamountPlus
  legacy_policy_groups:
  - Apple
  - Microsoft
  - Streaming
