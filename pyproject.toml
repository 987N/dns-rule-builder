[project]
name = "dns-rule-builder"
version = "0.1.0"
description = "Reproducible SmartDNS and Mihomo domain rule builder"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2,<7", "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "jinja2>=3.1,<4", "itsdangerous>=2.2,<3"]

[project.scripts]
dns-rule-builder = "dns_rule_builder.cli:main"
dns-rule-target-v4 = "dns_rule_builder.target_agent:main"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dns_rule_builder"]

[dependency-groups]
dev = ["pytest>=8.3,<9", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

