services:
  dns-rule-builder:
    image: ${DNS_RULE_BUILDER_IMAGE:?Set DNS_RULE_BUILDER_IMAGE to a tested tag or immutable digest}
    container_name: dns-rule-builder
    restart: unless-stopped
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    environment:
      DATA_ROOT: /data
      PROJECT_ROOT: /app
      GITHUB_OWNER: ${GITHUB_OWNER:-987N}
      GITHUB_REPOSITORY_NAME: ${GITHUB_REPOSITORY_NAME:-dns-rule-builder}
      GITHUB_TOKEN_FILE: /run/secrets/github_token
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      SESSION_SECRET_FILE: /run/secrets/session_secret
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
    volumes:
      - ${DATA_DIR:-./data}:/data
    secrets:
      - github_token
      - admin_password
      - session_secret
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

secrets:
  github_token:
    file: ${GITHUB_TOKEN_SECRET_FILE:-./secrets/github_token}
  admin_password:
    file: ${ADMIN_PASSWORD_SECRET_FILE:-./secrets/admin_password}
  session_secret:
    file: ${SESSION_SECRET_SECRET_FILE:-./secrets/session_secret}
