<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · DNS 规则台</title><link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-shell">
  <main class="login-card">
    <div class="eyebrow"><span class="signal-dot"></span> HOMENETWORK / RULES</div>
    <h1>DNS 规则台</h1>
    <p class="muted">管理公开规则数据，查看构建与候选版本。</p>
    <form id="login-form">
      <label for="password">管理员密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button class="primary wide" type="submit">登录</button>
      <p class="form-error" id="login-error" role="alert"></p>
    </form>
    <p class="small muted">密码通过只读 secret 文件提供；应用没有默认密码。</p>
  </main>
  <script src="/static/login.js" defer></script>
</body>
</html>
